[project]
name = "agent_local_files"
version = "0.0.1"
description = "A fully offline agent that reasons over local files using local models (Ollama + RAG)"
authors = [{ name = "Restack Team", email = "service@restack.io" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
dependencies = [
    "openai>=1.61.0",
    "numpy>=1.26",
    "pydantic>=2.10.6",
    "watchfiles>=1.0.4",
    "python-dotenv==1.0.1",
    "restack-ai>=0.0.91",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",]

[project.scripts]
dev = "src.services:watch_services"
services = "src.services:run_services"
schedule = "schedule:run_schedule"
ingest = "ingest:run_ingest"
serve = "webui.server:main"

[tool.hatch.build.targets.sdist]
include = ["src", "webui"]

[tool.hatch.build.targets.wheel]
include = ["src", "webui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
