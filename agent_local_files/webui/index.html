<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Files Assistant — Offline Chat</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #ffffff;
        --user: #2563eb;
        --user-text: #ffffff;
        --assistant: #f1f5f9;
        --assistant-text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --accent: #10b981;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
        color: var(--assistant-text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .app {
        width: 100%;
        max-width: 760px;
        height: min(90vh, 900px);
        background: var(--panel);
        border-radius: 20px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        padding: 18px 22px;
        background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      header .logo {
        width: 42px; height: 42px; border-radius: 12px;
        background: rgba(255, 255, 255, 0.18);
        display: flex; align-items: center; justify-content: center;
        font-size: 22px;
      }
      header .titles { flex: 1; }
      header h1 { margin: 0; font-size: 18px; font-weight: 650; }
      header p { margin: 2px 0 0; font-size: 12.5px; opacity: 0.85; }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 11px; font-weight: 600;
        background: rgba(16, 185, 129, 0.9);
        padding: 4px 9px; border-radius: 999px;
      }
      .badge .dot {
        width: 7px; height: 7px; border-radius: 50%; background: #d1fae5;
      }
      .newchat {
        border: 0; cursor: pointer; color: #fff; font-weight: 600;
        font-size: 13px; padding: 8px 12px; border-radius: 10px;
        background: rgba(255, 255, 255, 0.16);
      }
      .newchat:hover { background: rgba(255, 255, 255, 0.28); }
      #messages {
        flex: 1; overflow-y: auto; padding: 22px;
        display: flex; flex-direction: column; gap: 14px;
        background: #fbfcfe;
      }
      .row { display: flex; }
      .row.user { justify-content: flex-end; }
      .row.assistant { justify-content: flex-start; }
      .bubble {
        max-width: 78%; padding: 12px 15px; border-radius: 16px;
        font-size: 15px; line-height: 1.5; white-space: pre-wrap;
        word-wrap: break-word;
      }
      .user .bubble {
        background: var(--user); color: var(--user-text);
        border-bottom-right-radius: 5px;
      }
      .assistant .bubble {
        background: var(--assistant); color: var(--assistant-text);
        border-bottom-left-radius: 5px;
      }
      .sources {
        margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px;
      }
      .chip {
        font-size: 11px; color: var(--muted);
        background: #fff; border: 1px solid var(--border);
        padding: 3px 9px; border-radius: 999px;
      }
      .hint {
        text-align: center; color: var(--muted); font-size: 13.5px;
        margin: auto; max-width: 420px; line-height: 1.6;
      }
      .hint .big { font-size: 30px; display: block; margin-bottom: 8px; }
      .typing { display: inline-flex; gap: 5px; align-items: center; }
      .typing span {
        width: 8px; height: 8px; border-radius: 50%; background: #94a3b8;
        animation: blink 1.3s infinite both;
      }
      .typing span:nth-child(2) { animation-delay: 0.2s; }
      .typing span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink {
        0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }
      .thinking-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
      footer {
        border-top: 1px solid var(--border); padding: 14px;
        background: #fff;
      }
      .composer { display: flex; gap: 10px; align-items: flex-end; }
      textarea {
        flex: 1; resize: none; border: 1px solid var(--border);
        border-radius: 14px; padding: 12px 14px; font: inherit;
        font-size: 15px; max-height: 140px; outline: none;
      }
      textarea:focus { border-color: var(--user); }
      textarea:disabled { background: #f8fafc; }
      .send {
        border: 0; cursor: pointer; background: var(--user); color: #fff;
        font-weight: 650; font-size: 15px; padding: 12px 20px;
        border-radius: 14px;
      }
      .send:disabled { background: #93c5fd; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="logo">📚</div>
        <div class="titles">
          <h1>Local Files Assistant</h1>
          <p>Answers from your files, running entirely on your machine.</p>
        </div>
        <span class="badge"><span class="dot"></span>Offline</span>
        <button class="newchat" id="newchat">New chat</button>
      </header>

      <div id="messages">
        <div class="hint" id="hint">
          <span class="big">👋</span>
          Ask me anything about this project — for example:
          <em>“How does this project run agents fully offline?”</em>
          I read the local knowledge base and answer without using the internet.
        </div>
      </div>

      <footer>
        <div class="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Type your question and press Enter…"
          ></textarea>
          <button class="send" id="send">Send</button>
        </div>
      </footer>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const hintEl = document.getElementById("hint");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const newChatBtn = document.getElementById("newchat");

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addBubble(role, text, sources) {
        if (hintEl && hintEl.parentNode) hintEl.remove();
        const row = document.createElement("div");
        row.className = "row " + role;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        if (sources && sources.length) {
          const wrap = document.createElement("div");
          wrap.className = "sources";
          for (const s of sources) {
            const chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = "📄 " + s;
            wrap.appendChild(chip);
          }
          bubble.appendChild(wrap);
        }
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();
        return row;
      }

      function addThinking() {
        if (hintEl && hintEl.parentNode) hintEl.remove();
        const row = document.createElement("div");
        row.className = "row assistant";
        row.innerHTML =
          '<div class="bubble"><span class="typing">' +
          "<span></span><span></span><span></span></span>" +
          '<div class="thinking-note">Thinking… local models run on CPU, ' +
          "so this can take a couple of minutes.</div></div>";
        messagesEl.appendChild(row);
        scrollToBottom();
        return row;
      }

      function setBusy(busy) {
        inputEl.disabled = busy;
        sendBtn.disabled = busy;
        if (!busy) inputEl.focus();
      }

      async function send() {
        const text = inputEl.value.trim();
        if (!text) return;
        addBubble("user", text);
        inputEl.value = "";
        autoGrow();
        setBusy(true);
        const thinking = addThinking();
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });
          const data = await res.json();
          thinking.remove();
          if (!res.ok || data.error) {
            addBubble("assistant", "⚠️ " + (data.error || "Something went wrong."));
          } else {
            addBubble("assistant", data.reply, data.sources);
          }
        } catch (err) {
          thinking.remove();
          addBubble("assistant", "⚠️ Could not reach the assistant. " + err);
        } finally {
          setBusy(false);
        }
      }

      async function newChat() {
        setBusy(true);
        try {
          await fetch("/api/new", { method: "POST" });
        } catch (err) {
          /* ignore */
        }
        messagesEl.innerHTML = "";
        messagesEl.appendChild(hintEl);
        setBusy(false);
      }

      function autoGrow() {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
      }

      inputEl.addEventListener("input", autoGrow);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      sendBtn.addEventListener("click", send);
      newChatBtn.addEventListener("click", newChat);
      inputEl.focus();
    </script>
  </body>
</html>
